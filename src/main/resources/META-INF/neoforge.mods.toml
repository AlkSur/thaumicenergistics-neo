modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="thaumicenergistics"
version="${version}"
displayName="ThaumicEnergistics"
description="Bridges Thaumcraft Essentia with Applied Energistics 2 ME networks."
authors="Nividica, Community"
logoFile="assets/thaumicenergistics/meta/logo.png"
displayTest="IGNORE_ALL_VERSION"

[[dependencies.thaumicenergistics]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.thaumicenergistics]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.thaumicenergistics]]
modId="ae2"
type="required"
versionRange="[19,)"
ordering="AFTER"
side="BOTH"

[[dependencies.thaumicenergistics]]
modId="thaumcraft"
type="required"
versionRange="[0.2.2.95,)"
ordering="AFTER"
side="BOTH"

[[dependencies.thaumicenergistics]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="NONE"
side="CLIENT"

[[dependencies.thaumicenergistics]]
modId="extendedae"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# COMPAT-PLAN：AE2WT API 独立模组（ae2wtlib 的硬前置）。BEFORE 保证我方在 API 的
# RegisterEvent(ITEM) 监听器（执行 AddTerminalEvent.run()）之前完成 AddTerminalEvent.register。
[[dependencies.thaumicenergistics]]
modId="ae2wtlib_api"
type="optional"
# EAE/AAE/AE2LT 自带较旧 API 时不启用我方 AE2WT 实现，不应拦截独立终端运行。
# 真正接入需要完整 ae2wtlib；它自身要求对应的精确 API 版本。
versionRange="*"
ordering="BEFORE"
side="BOTH"

[[dependencies.thaumicenergistics]]
modId="ae2wtlib"
type="optional"
versionRange="[19.5.1,20)"
ordering="NONE"
side="BOTH"

[[dependencies.thaumicenergistics]]
modId="advanced_ae"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.thaumicenergistics]]
modId="ae2lt"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="thaumicenergistics.mixins.json"

[[mixins]]
config="thaumicenergistics.provider.mixins.json"

[[mixins]]
config="thaumicenergistics.provider.essentia.mixins.json"

[[mixins]]
config="thaumicenergistics.compat.mixins.json"
